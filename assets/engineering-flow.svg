<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 820 462" width="820" height="462" role="img" aria-label="Software lifecycle: real-world need to problem, product, system, engineering, users, feedback, improve, then repeat.">
  <title>How I think about software — from real-world need to improvement</title>
  <defs>
    <marker id="arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrowSoft" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L8 4 L0 8 Z" fill="#CBD5E1"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="819" height="461" rx="16" fill="#F8FAFC" stroke="#E2E8F0"/>

  <text x="56" y="44" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#94A3B8">REAL-WORLD NEED</text>
  <text x="800" y="44" text-anchor="end" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="2" fill="#94A3B8">SYSTEM LIFECYCLE</text>

  <g stroke="#94A3B8" stroke-width="1.5" fill="none" stroke-dasharray="5 4">
    <path d="M274 98 H315" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M539 98 H580" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M693 138 V170" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M693 280 V306 H163 V320" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M274 366 H315" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/>
    </path>
    <path d="M539 366 H580" marker-end="url(#arrow)">
      <animate attributeName="stroke-dashoffset" values="0;-18" dur="2.4s" repeatCount="indefinite"/>
    </path>
  </g>

  <path d="M693 406 V432 H28 V98 H50" fill="none" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="4 5" marker-end="url(#arrowSoft)"/>

  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <g>
      <rect x="56" y="58" width="214" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="56" y="74" width="4" height="48" rx="2" fill="#F59E0B"/>
      <text x="78" y="96" font-size="14" font-weight="700" letter-spacing="0.8" fill="#0F172A">PROBLEM</text>
      <text x="78" y="116" font-size="11" fill="#64748B">UNDERSTAND</text>
    </g>
    <g>
      <rect x="321" y="58" width="214" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="321" y="74" width="4" height="48" rx="2" fill="#2563EB"/>
      <text x="343" y="96" font-size="14" font-weight="700" letter-spacing="0.8" fill="#0F172A">PRODUCT</text>
      <text x="343" y="116" font-size="11" fill="#64748B">DEFINE</text>
    </g>
    <g>
      <rect x="586" y="58" width="214" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="586" y="74" width="4" height="48" rx="2" fill="#0D9488"/>
      <text x="608" y="96" font-size="14" font-weight="700" letter-spacing="0.8" fill="#0F172A">SYSTEM</text>
      <text x="608" y="116" font-size="11" fill="#64748B">DESIGN</text>
    </g>
  </g>

  <rect x="56" y="176" width="744" height="104" rx="12" fill="#FFFFFF" stroke="#CBD5E1"/>
  <text x="72" y="200" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="2" fill="#0D9488">ENGINEERING</text>

  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <rect x="72" y="220" width="94" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="119" y="243" font-size="10.5" font-weight="600" fill="#334155">FRONTEND</text>

    <rect x="175" y="220" width="94" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="222" y="243" font-size="10.5" font-weight="600" fill="#334155">BACKEND</text>

    <rect x="278" y="220" width="94" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="325" y="243" font-size="10.5" font-weight="600" fill="#334155">DATABASE</text>

    <rect x="381" y="220" width="94" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="428" y="237" font-size="10.5" font-weight="600" fill="#334155">APIs</text>
    <text x="428" y="249" font-size="8" fill="#94A3B8">COMMUNICATION</text>

    <rect x="484" y="220" width="94" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="531" y="237" font-size="10.5" font-weight="600" fill="#334155">SECURITY</text>
    <text x="531" y="249" font-size="8" fill="#94A3B8">&amp; ACCESS</text>

    <rect x="587" y="220" width="94" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="634" y="237" font-size="10.5" font-weight="600" fill="#334155">TEST</text>
    <text x="634" y="249" font-size="8" fill="#94A3B8">&amp; VALIDATE</text>

    <rect x="690" y="220" width="94" height="38" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
    <text x="737" y="237" font-size="10.5" font-weight="600" fill="#334155">DEPLOY</text>
    <text x="737" y="249" font-size="8" fill="#94A3B8">INFRASTRUCTURE</text>
  </g>

  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <g>
      <rect x="56" y="326" width="214" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="56" y="342" width="4" height="48" rx="2" fill="#0D9488"/>
      <text x="78" y="364" font-size="14" font-weight="700" letter-spacing="0.8" fill="#0F172A">USERS</text>
      <text x="78" y="384" font-size="11" fill="#64748B">REAL-WORLD USE</text>
    </g>
    <g>
      <rect x="321" y="326" width="214" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="321" y="342" width="4" height="48" rx="2" fill="#F59E0B"/>
      <text x="343" y="364" font-size="14" font-weight="700" letter-spacing="0.8" fill="#0F172A">FEEDBACK</text>
      <text x="343" y="384" font-size="11" fill="#64748B">SIGNALS &amp; DATA</text>
    </g>
    <g>
      <rect x="586" y="326" width="214" height="80" rx="12" fill="#FFFFFF" stroke="#E2E8F0"/>
      <rect x="586" y="342" width="4" height="48" rx="2" fill="#2563EB">
        <animate attributeName="opacity" values="1;0.4;1" dur="3.2s" repeatCount="indefinite"/>
      </rect>
      <text x="608" y="364" font-size="14" font-weight="700" letter-spacing="0.8" fill="#0F172A">IMPROVE</text>
      <text x="608" y="384" font-size="11" fill="#64748B">ITERATE</text>
    </g>
  </g>

  <text x="360" y="452" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="3" fill="#94A3B8">REPEAT</text>
</svg>
