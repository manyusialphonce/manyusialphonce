<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 690" width="620" height="690" role="img" aria-label="Ten engineering principles: understand, simplify, design, build, secure, test, ship, observe, improve, scale.">
  <title>Engineering Principles</title>
  <desc>Ten engineering principles: 01 understand, 02 simplify, 03 design, 04 build, 05 secure, 06 test, 07 ship, 08 observe, 09 improve, 10 scale.</desc>
  <defs>
    <linearGradient id="accentBar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2563EB"/>
      <stop offset="0.5" stop-color="#0D9488"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>

  <rect x="0.5" y="0.5" width="619" height="689" rx="14" fill="#0B1220" stroke="#1B2A42"/>
  <rect x="14" y="14" width="592" height="3" rx="1.5" fill="url(#accentBar)"/>

  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <text x="28" y="72" font-size="30" font-weight="700" letter-spacing="1" fill="#3B82F6">01</text>
    <text x="28" y="100" font-size="14" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">UNDERSTAND</text>
    <text x="28" y="122" font-size="12" fill="#93A4BC">Understand the problem before</text>
    <text x="28" y="139" font-size="12" fill="#93A4BC">building the solution.</text>
    <line x1="28" y1="156" x2="292" y2="156" stroke="#1E2A40" stroke-width="1"/>

    <text x="328" y="72" font-size="30" font-weight="700" letter-spacing="1" fill="#2DD4BF">02</text>
    <text x="328" y="100" font-size="14" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">SIMPLIFY</text>
    <text x="328" y="122" font-size="12" fill="#93A4BC">Prefer simple and clear solutions</text>
    <text x="328" y="139" font-size="12" fill="#93A4BC">over unnecessary complexity.</text>
    <line x1="328" y1="156" x2="592" y2="156" stroke="#1E2A40" stroke-width="1"/>

    <text x="28" y="198" font-size="30" font-weight="700" letter-spacing="1" fill="#F59E0B">03</text>
    <text x="28" y="226" font-size="14" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">DESIGN</text>
    <text x="28" y="248" font-size="12" fill="#93A4BC">Think about architecture, data and</text>
    <text x="28" y="265" font-size="12" fill="#93A4BC">user experience before implementation.</text>
    <line x1="28" y1="282" x2="292" y2="282" stroke="#1E2A40" stroke-width="1"/>

    <text x="328" y="198" font-size="30" font-weight="700" letter-spacing="1" fill="#3B82F6">04</text>
    <text x="328" y="226" font-size="14" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">BUILD</text>
    <text x="328" y="248" font-size="12" fill="#93A4BC">Turn the design into reliable</text>
    <text x="328" y="265" font-size="12" fill="#93A4BC">working software.</text>
    <line x1="328" y1="282" x2="592" y2="282" stroke="#1E2A40" stroke-width="1"/>

    <text x="28" y="324" font-size="30" font-weight="700" letter-spacing="1" fill="#2DD4BF">05</text>
    <text x="28" y="352" font-size="14" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">SECURE</text>
    <text x="28" y="374" font-size="12" fill="#93A4BC">Protect users, systems and data</text>
    <text x="28" y="391" font-size="12" fill="#93A4BC">from the beginning.</text>
    <line x1="28" y1="408" x2="292" y2="408" stroke="#1E2A40" stroke-width="1"/>

    <text x="328" y="324" font-size="30" font-weight="700" letter-spacing="1" fill="#F59E0B">06</text>
    <text x="328" y="352" font-size="14" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">TEST</text>
    <text x="328" y="374" font-size="12" fill="#93A4BC">Validate the system before trusting it.</text>
    <line x1="328" y1="408" x2="592" y2="408" stroke="#1E2A40" stroke-width="1"/>

    <text x="28" y="450" font-size="30" font-weight="700" letter-spacing="1" fill="#3B82F6">07</text>
    <text x="28" y="478" font-size="14" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">SHIP</text>
    <text x="28" y="500" font-size="12" fill="#93A4BC">A product creates value when people</text>
    <text x="28" y="517" font-size="12" fill="#93A4BC">can actually use it.</text>
    <line x1="28" y1="534" x2="292" y2="534" stroke="#1E2A40" stroke-width="1"/>

    <text x="328" y="450" font-size="30" font-weight="700" letter-spacing="1" fill="#2DD4BF">08</text>
    <text x="328" y="478" font-size="14" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">OBSERVE</text>
    <text x="328" y="500" font-size="12" fill="#93A4BC">Understand how the system behaves</text>
    <text x="328" y="517" font-size="12" fill="#93A4BC">in the real world.</text>
    <line x1="328" y1="534" x2="592" y2="534" stroke="#1E2A40" stroke-width="1"/>

    <text x="28" y="576" font-size="30" font-weight="700" letter-spacing="1" fill="#F59E0B">09</text>
    <text x="28" y="604" font-size="14" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">IMPROVE</text>
    <text x="28" y="626" font-size="12" fill="#93A4BC">Learn from feedback and</text>
    <text x="28" y="643" font-size="12" fill="#93A4BC">continuously make the system better.</text>
    <line x1="28" y1="660" x2="292" y2="660" stroke="#1E2A40" stroke-width="1"/>

    <text x="328" y="576" font-size="30" font-weight="700" letter-spacing="1" fill="#3B82F6">10</text>
    <text x="328" y="604" font-size="14" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">SCALE</text>
    <text x="328" y="626" font-size="12" fill="#93A4BC">Prepare the product and architecture</text>
    <text x="328" y="643" font-size="12" fill="#93A4BC">for future growth.</text>
    <line x1="328" y1="660" x2="592" y2="660" stroke="#1E2A40" stroke-width="1"/>
  </g>
</svg>
