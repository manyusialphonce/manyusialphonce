<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 545" width="900" height="545" role="img" aria-label="Ten engineering principles: understand, simplify, design, build, secure, test, ship, observe, improve, scale.">
  <title>Engineering Principles</title>
  <desc>Ten engineering principles: 01 understand, 02 simplify, 03 design, 04 build, 05 secure, 06 test, 07 ship, 08 observe, 09 improve, 10 scale.</desc>

  <rect x="0.5" y="0.5" width="899" height="544" rx="14" fill="#0B1220" stroke="#1B2A42"/>
  <rect x="14" y="14" width="58" height="3" rx="1.5" fill="#2563EB"/>

  <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
    <text x="28" y="70" font-size="26" font-weight="700" letter-spacing="1" fill="#3B82F6">01</text>
    <text x="28" y="94" font-size="13" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">UNDERSTAND</text>
    <text x="28" y="118" font-size="11.5" fill="#93A4BC">Understand the problem before building the solution.</text>
    <line x1="28" y1="132" x2="430" y2="132" stroke="#1E2A40" stroke-width="1"/>

    <text x="470" y="70" font-size="26" font-weight="700" letter-spacing="1" fill="#2DD4BF">02</text>
    <text x="470" y="94" font-size="13" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">SIMPLIFY</text>
    <text x="470" y="118" font-size="11.5" fill="#93A4BC">Prefer simple and clear solutions over unnecessary complexity.</text>
    <line x1="470" y1="132" x2="872" y2="132" stroke="#1E2A40" stroke-width="1"/>

    <text x="28" y="166" font-size="26" font-weight="700" letter-spacing="1" fill="#F59E0B">03</text>
    <text x="28" y="190" font-size="13" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">DESIGN</text>
    <text x="28" y="208" font-size="11.5" fill="#93A4BC">Think about architecture, data and user experience</text>
    <text x="28" y="223" font-size="11.5" fill="#93A4BC">before implementation.</text>
    <line x1="28" y1="228" x2="430" y2="228" stroke="#1E2A40" stroke-width="1"/>

    <text x="470" y="166" font-size="26" font-weight="700" letter-spacing="1" fill="#3B82F6">04</text>
    <text x="470" y="190" font-size="13" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">BUILD</text>
    <text x="470" y="214" font-size="11.5" fill="#93A4BC">Turn the design into reliable working software.</text>
    <line x1="470" y1="228" x2="872" y2="228" stroke="#1E2A40" stroke-width="1"/>

    <text x="28" y="262" font-size="26" font-weight="700" letter-spacing="1" fill="#2DD4BF">05</text>
    <text x="28" y="286" font-size="13" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">SECURE</text>
    <text x="28" y="310" font-size="11.5" fill="#93A4BC">Protect users, systems and data from the beginning.</text>
    <line x1="28" y1="324" x2="430" y2="324" stroke="#1E2A40" stroke-width="1"/>

    <text x="470" y="262" font-size="26" font-weight="700" letter-spacing="1" fill="#F59E0B">06</text>
    <text x="470" y="286" font-size="13" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">TEST</text>
    <text x="470" y="310" font-size="11.5" fill="#93A4BC">Validate the system before trusting it.</text>
    <line x1="470" y1="324" x2="872" y2="324" stroke="#1E2A40" stroke-width="1"/>

    <text x="28" y="358" font-size="26" font-weight="700" letter-spacing="1" fill="#3B82F6">07</text>
    <text x="28" y="382" font-size="13" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">SHIP</text>
    <text x="28" y="406" font-size="11.5" fill="#93A4BC">A product creates value when people can actually use it.</text>
    <line x1="28" y1="420" x2="430" y2="420" stroke="#1E2A40" stroke-width="1"/>

    <text x="470" y="358" font-size="26" font-weight="700" letter-spacing="1" fill="#2DD4BF">08</text>
    <text x="470" y="382" font-size="13" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">OBSERVE</text>
    <text x="470" y="406" font-size="11.5" fill="#93A4BC">Understand how the system behaves in the real world.</text>
    <line x1="470" y1="420" x2="872" y2="420" stroke="#1E2A40" stroke-width="1"/>

    <text x="28" y="454" font-size="26" font-weight="700" letter-spacing="1" fill="#F59E0B">09</text>
    <text x="28" y="478" font-size="13" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">IMPROVE</text>
    <text x="28" y="502" font-size="11.5" fill="#93A4BC">Learn from feedback and continuously make the system better.</text>
    <line x1="28" y1="516" x2="430" y2="516" stroke="#1E2A40" stroke-width="1"/>

    <text x="470" y="454" font-size="26" font-weight="700" letter-spacing="1" fill="#3B82F6">10</text>
    <text x="470" y="478" font-size="13" font-weight="700" letter-spacing="2.4" fill="#E8EEF6">SCALE</text>
    <text x="470" y="502" font-size="11.5" fill="#93A4BC">Prepare the product and architecture for future growth.</text>
    <line x1="470" y1="516" x2="872" y2="516" stroke="#1E2A40" stroke-width="1"/>
  </g>
</svg>
