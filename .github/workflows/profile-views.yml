name: Update profile views badge

on:
  schedule:
    - cron: "41 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: profile-views-badge
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch view count and render badge
        env:
          BADGE_URL: "https://komarev.com/ghpvc/?username=manyusialphonce&label=PROFILE%20VIEWS&color=2563EB&style=flat-square"
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/views"
          if ! curl -fsSL --max-time 30 "$BADGE_URL" -o "$RUNNER_TEMP/views/upstream.svg"; then
            echo "Upstream counter unavailable - keeping the existing badge." >&2
            exit 0
          fi
          count="$(grep -oP '(?<=y="14">)[0-9]+' "$RUNNER_TEMP/views/upstream.svg" | tail -n 1 || true)"
          if [ -z "$count" ]; then
            echo "Could not parse a view count - keeping the existing badge." >&2
            exit 0
          fi
          echo "Fetched view count: $count"

          current="$(grep -oP '(?<=aria-label="Profile views: )[0-9]+' assets/profile-views.svg | tail -n 1 || true)"
          if [ "$current" = "$count" ]; then
            echo "Badge already current at $count - nothing to commit."
            exit 0
          fi

          label_w=123
          digits=${#count}
          value_w=$(( 10 + digits * 7 ))
          total=$(( label_w + value_w ))
          value_cx=$(( label_w + value_w / 2 ))

          cat > assets/profile-views.svg <<SVG
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 $total 24" width="$total" height="24" role="img" aria-label="Profile views: $count">
            <title>Profile Views</title>
            <desc>GitHub profile view counter showing $count views.</desc>
            <g font-family="Segoe UI, Inter, Helvetica Neue, Arial, sans-serif">
              <rect width="$total" height="24" rx="5" fill="#1E293B"/>
              <rect x="$label_w" width="$value_w" height="24" fill="#2563EB"/>
              <g transform="translate(7,5) scale(0.5833)" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linejoin="round">
                <path d="M2.6 12S6.2 6.2 12 6.2 21.4 12 21.4 12 17.8 17.8 12 17.8 2.6 12 2.6 12Z"/>
                <circle cx="12" cy="12" r="2.6" fill="#FFFFFF" stroke="none"/>
              </g>
              <text x="26" y="16.8" font-size="11.5" font-weight="600" letter-spacing="0.4" fill="#FFFFFF">PROFILE VIEWS</text>
              <text x="$value_cx" y="16.8" text-anchor="middle" font-size="11.5" font-weight="700" fill="#FFFFFF">$count</text>
            </g>
          </svg>
          SVG

      - name: Commit updated badge
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/profile-views.svg
          if git diff --cached --quiet; then
            echo "No change to commit."
            exit 0
          fi
          git commit -m "chore: update profile views badge"
          git push
